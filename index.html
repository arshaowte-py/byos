<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make Your Own Shoe — Frido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Frido · Make Your Own Shoe — Design system v4 (consolidated, visual only)
   Surfaces: canvas → surface → component. Signature corner on hero components.
   ========================================================================== */
:root{
  --yellow:#FFD100; --ink:#101820; --white:#FFFFFF;
  --mint:#80E0A7; --coral:#FF585D; --blue:#6CACE4;
  --bg:#101820; --s1:#16212B; --s2:#1B2733; --s3:#223040;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#F4F7FA; --muted:#97A3AF; --faint:#66727E;
  --chip:var(--s2); --card:var(--s1); --surface:var(--s1);
  --r:14px; --r-sm:10px; --pill:999px; --sig:32px 6px 6px 6px; --sig-sm:22px 4px 4px 4px;
  --sh:0 18px 40px -18px rgba(0,0,0,.55);
  --f-display:clamp(40px,5.2vw,56px); --f-h1:clamp(30px,3.6vw,42px); --f-h2:24px; --f-body:16px; --f-sm:14px; --f-meta:12.5px;
  --sp1:8px; --sp2:12px; --sp3:16px; --sp4:24px; --sp5:32px; --sp6:48px;
  --ease:cubic-bezier(.2,.7,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F5F6F8; --s1:#FFFFFF; --s2:#FFFFFF; --s3:#F0F2F5;
  --line:#E4E8ED; --line2:#CBD3DB; --text:#101820; --muted:#5B6672; --faint:#8A949E;
  --sh:0 18px 40px -22px rgba(16,24,32,.25);
}
:root[data-theme="dark"]{ --bg:#101820; --s1:#16212B; --s2:#1B2733; --s3:#223040; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16); --text:#F4F7FA; --muted:#97A3AF; --faint:#66727E; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;color:var(--text);font:400 var(--f-body)/1.5 Outfit,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 100% -10%,color-mix(in srgb,var(--yellow) 10%,transparent),transparent 70%) no-repeat,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
img{max-width:100%}
.hint{margin:0 0 var(--sp3);color:var(--muted);font-size:var(--f-sm)}
.req{color:var(--coral)}
.staff{} body.m-cust .staff{display:none!important}

/* ---------- Header + step rail ---------- */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.brand .wm{color:var(--yellow);font-weight:700;font-size:28px;letter-spacing:-.5px;line-height:1}
.brand .tl{font-size:14px;color:var(--muted);padding-left:14px;border-left:1px solid var(--line2)}
.navbtns{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.navbtns>button,.admin>button{border:0;background:transparent;color:var(--muted);border-radius:var(--pill);padding:8px 14px;font-weight:500;font-size:14px}
.navbtns>button:hover,.admin>button:hover{color:var(--text)}
.navbtns>button.on{background:var(--yellow);color:var(--ink)}
.admin>button.on{color:var(--text)}
.seg2{display:inline-flex;background:var(--s2);border-radius:var(--pill);padding:3px}
.seg2 button{border:0;background:transparent;color:var(--muted);border-radius:var(--pill);padding:6px 12px;font-size:13.5px;font-weight:500}
.seg2 button.on{background:var(--text);color:var(--bg)}
.admin{position:relative}
.amenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;min-width:190px;z-index:20;box-shadow:var(--sh)}
.amenu button{text-align:left;border:0;background:transparent;border-radius:var(--r-sm);padding:9px 12px;color:var(--text)}
.amenu button:hover{background:var(--s3)}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;color:var(--text)}
.theme::before{content:"";width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.rail{max-width:1180px;margin:0 auto;padding:4px 24px 14px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--faint);font-size:13.5px;font-weight:500;padding:6px 10px 6px 0;white-space:nowrap;position:relative}
.rail button:not(:last-child)::after{content:"";flex:1;min-width:16px;height:2px;border-radius:2px;background:var(--line2);margin-left:6px}
.rail button b{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700}
.rail button.done{color:var(--text)}
.rail button.done b{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.rail button.done::after{background:var(--mint)}
.rail button.cur{color:var(--text)}
.rail button.cur b{background:var(--yellow);border-color:var(--yellow);color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 22%,transparent)}
.rail button:disabled{cursor:default}

/* ---------- Page scaffolding + type ---------- */
main{max-width:1180px;margin:0 auto;padding:var(--sp6) 24px 140px}
.eyebrow{display:inline-block;font-size:var(--f-meta);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:var(--sp2)}
.lead{margin:0 0 var(--sp2);font-size:var(--f-h1);font-weight:700;letter-spacing:-.6px;line-height:1.06}
.lead em{font-weight:300;font-style:italic}
.sub{margin:0 0 var(--sp5);color:var(--muted);font-size:17px;max-width:62ch}
h3.secttl{font-size:var(--f-h2);font-weight:700;margin:var(--sp5) 0 var(--sp1)}
h3.secttl em{font-weight:300;font-style:italic}
h4.sec{font-size:var(--f-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:var(--sp5) 0 var(--sp3)}
.panel{background:var(--s1);border-radius:var(--r);padding:var(--sp4);margin-bottom:var(--sp3)}
.panel h3{margin:0 0 4px;font-size:18px;font-weight:600}
.grid{display:grid;gap:var(--sp3)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr} main{padding:var(--sp5) 18px 140px}}
.foot{max-width:1180px;margin:0 auto;padding:var(--sp3) 24px 130px;color:var(--faint);font-size:13px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.foot i{width:14px;height:14px;border-radius:50%;border:4px solid var(--yellow);display:inline-block}

/* ---------- Form controls ---------- */
label.f{display:block;font-size:var(--f-sm);color:var(--muted);font-weight:500}
.inp{display:block;width:100%;margin-top:6px;padding:13px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);font-size:16px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 25%,transparent)}
textarea.inp{min-height:96px;resize:vertical}
select.inp{appearance:auto}
.pre{display:flex;align-items:stretch;margin-top:6px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);overflow:hidden}
.pre span{padding:0 12px;color:var(--muted);border-right:1px solid var(--line2);display:flex;align-items:center}
.pre .inp{margin:0;border:0;border-radius:0}
.pre:focus-within{border-color:var(--yellow)}
.pre .inp:focus{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--s2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 16px;font-size:15px;line-height:1.2;text-align:left;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:600}
.chip.big{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:150px}
.chip.big small{font-size:13px;opacity:.75}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;transition:background .15s}
.on > button > .box,.confirm.on .box,.skip.on .box{background:var(--yellow);border-color:var(--yellow)}
.on > button > .box::after,.confirm.on .box::after,.skip.on .box::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sev{display:flex;background:var(--bg);border-radius:var(--r-sm);padding:3px;gap:2px}
.sev button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-size:13px;color:var(--muted)}
.sev button.on{background:var(--text);color:var(--bg);font-weight:600}
.linkbtn{background:none;border:0;color:var(--blue);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:var(--pill);padding:12px 22px;border:1px solid var(--line2);background:transparent;font-weight:600;font-size:15px;text-decoration:none;color:var(--text);transition:transform .15s var(--ease),background .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn.pri:hover{background:#FFDA33}
.btn.big{font-size:17px;padding:15px 28px}
.btn.sm{padding:7px 16px;font-size:14px}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.btn.rec{border-color:var(--coral);color:var(--coral)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .arr{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);margin-right:-12px}
.btn .arr::before{content:"";width:7px;height:7px;border:solid var(--yellow);border-width:2px 2px 0 0;transform:translateX(-1px) rotate(45deg)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 var(--sp4)}

/* metadata pills only */
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:var(--pill);background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--mint);align-self:flex-start;letter-spacing:.02em}
.tag.y{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--yellow)}
.tag.cc{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.lock{font-size:12px;color:var(--coral);font-weight:600}
.needs{font-size:12px;color:var(--blue);font-weight:600}
.blink{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:blink 2s infinite}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(255,209,0,.6)}70%{box-shadow:0 0 0 8px rgba(255,209,0,0)}100%{box-shadow:0 0 0 0 rgba(255,209,0,0)}}
.bpill{display:inline-flex;align-items:center;gap:8px;color:var(--yellow);border:1px solid color-mix(in srgb,var(--yellow) 50%,transparent);border-radius:var(--pill);padding:6px 14px;font-weight:600;font-size:13.5px}
.blinks{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:calc(-1*var(--sp3)) 0 var(--sp4)}
.blinks small{color:var(--muted)}
.unitog{margin-top:10px;display:inline-flex;align-items:center;gap:8px;border:1px dashed color-mix(in srgb,var(--yellow) 60%,transparent);background:transparent;border-radius:var(--pill);padding:6px 14px;font-size:13.5px}
.unitog.on{border-style:solid;background:color-mix(in srgb,var(--yellow) 12%,transparent)}

/* notices */
.note,.flag{padding:14px 16px;border-radius:var(--r-sm);font-size:var(--f-sm);margin:var(--sp3) 0}
.note{background:color-mix(in srgb,var(--yellow) 10%,transparent);border-left:3px solid var(--yellow)}
.flag{background:color-mix(in srgb,var(--coral) 12%,transparent);border-left:3px solid var(--coral)}
.flag b{display:block}
.hold{display:flex;flex-direction:column;gap:2px;background:var(--coral);color:#fff;border-radius:var(--r);padding:14px 18px;margin:0 0 var(--sp4);position:sticky;top:120px;z-index:4;box-shadow:var(--sh)}
.hold b{font-size:16px}
.advice{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-radius:var(--r);padding:var(--sp3) 18px;margin:0 0 var(--sp4);background:var(--s1);border-left:3px solid var(--line2)}
.advice b{font-size:17px}.advice span{color:var(--muted)}
.advice.bad{border-left-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--s1))}
.advice.good{border-left-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,var(--s1))}
.advice .btn{margin-top:6px}
.suggest{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:var(--sp3) 0;padding:12px 16px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--blue) 12%,transparent);font-size:var(--f-sm)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* ---------- Landing ---------- */
.land{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:820px;padding-top:var(--sp4)}
.land .lead{font-size:var(--f-display);margin-bottom:var(--sp3)}
.land .sub{font-size:19px;margin-bottom:var(--sp4)}
.landviz{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp3);width:100%;margin:0 0 var(--sp4)}
@media (max-width:640px){.landviz{grid-template-columns:1fr}}
.lv{background:var(--s1);border-radius:var(--sig-sm);padding:20px}
.lv:last-child{background:linear-gradient(140deg,color-mix(in srgb,var(--yellow) 14%,var(--s1)),var(--s1) 70%)}
.lv small{display:block;color:var(--muted);margin-bottom:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px}
.same{display:flex;gap:10px;justify-content:space-between}.same svg{width:22%;height:auto}
.landpitch{font-size:18px;margin:0 0 var(--sp4);line-height:1.6}.landpitch b{color:var(--yellow);font-weight:600}
.landnote{color:var(--muted);margin-top:10px}

/* ---------- Conditions ---------- */
.healthy{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid transparent;border-radius:var(--r);padding:16px 18px;width:100%;text-align:left;transition:border-color .15s}
.healthy:hover{border-color:var(--line2)}
.healthy.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 8%,var(--s1))}
.conds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--sp3)}
.cond{background:var(--s1);border:1.5px solid transparent;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s var(--ease)}
.cond:hover{border-color:var(--line2)}
.cond.on{border-color:var(--yellow)}
.cond .cimgw{background:#fff;display:flex;align-items:center;justify-content:center;height:150px;padding:10px}
.cpic{display:block;width:100%;height:auto;object-fit:contain;background:#fff}
.cond .cimgw .cpic{height:100%;width:auto;max-width:100%}
.cond button.t{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:16px 16px 6px}
.cond b{font-weight:700;font-size:17px;display:block}
.cond small{color:var(--muted);font-size:var(--f-sm);display:block;margin-top:2px}
.cond .fixline{display:flex;gap:8px;align-items:center;padding:0 16px 14px 50px;font-size:13.5px}
.cond .sev{margin:0 16px 16px}
.ccap{display:none}

/* ---------- Design / product selection ---------- */
.designs{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp3)}
@media (max-width:700px){.designs{grid-template-columns:1fr}}
.design{background:var(--s1);border:1.5px solid transparent;border-radius:var(--r);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.design.on{border-color:var(--yellow)}
.design b{font-size:18px;font-weight:700}
.design span:not(.soon){font-size:var(--f-sm);color:var(--muted)}
.design:disabled{opacity:.5;cursor:not-allowed}
.design .pic{display:none}
.soon{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:700;color:var(--yellow);letter-spacing:.04em}
.styletabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:var(--sp4) 0 var(--sp4);border-bottom:1px solid var(--line)}
.styletabs button{flex:none;border:0;border-bottom:2px solid transparent;background:transparent;padding:10px 14px;font-size:15px;color:var(--muted);font-weight:500;margin-bottom:-1px}
.styletabs button.on{color:var(--text);border-bottom-color:var(--yellow)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--sp4) var(--sp3)}
.prod{position:relative;background:transparent;border-radius:var(--r);display:flex;flex-direction:column;transition:transform .2s var(--ease)}
.prod .pick{all:unset;cursor:pointer;display:flex;flex-direction:column;width:100%;position:relative}
.ppic{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:var(--r);padding:6% 8%;transition:transform .3s var(--ease),box-shadow .2s}
.ppic.sil{padding:12% 10%;background:var(--s2)}
.prod:hover .ppic{box-shadow:var(--sh)}
.prod.on .ppic{box-shadow:0 0 0 2px var(--yellow)}
.recbadge{position:absolute;top:12px;left:12px;z-index:1;background:var(--ink);color:var(--yellow);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:var(--pill);letter-spacing:.02em}
.pb{padding:14px 2px 6px;display:flex;flex-direction:column;gap:3px}
.pb .pl{font-size:var(--f-meta);color:var(--muted);font-weight:500}
.pb .pl .rec{font-style:normal;color:var(--mint)}
.pb b{font-weight:700;font-size:17px;line-height:1.25}
.pb .pp{font-size:16px;font-weight:600}
.pb p{margin:4px 0 0;font-size:var(--f-sm);color:var(--muted)}
.pb .because{color:var(--yellow);font-weight:500}
.swatches{display:flex;align-items:center;gap:8px;padding:6px 2px;flex-wrap:wrap;min-height:30px}
.sw2{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line2);padding:0;transition:transform .15s}
.sw2:hover{transform:scale(1.1)}
.sw2.on{box-shadow:0 0 0 2px var(--yellow)}
.cname{font-size:var(--f-meta);color:var(--muted)}
.cardact{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 2px 0}
.cardact .linkbtn{font-size:13.5px}
.prod .why{margin:0}
.tech{display:none}

/* ---------- Scan ---------- */
.scanbox{background:var(--s1);border-radius:var(--sig);padding:var(--sp5);display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp4)}
.stages{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.stg{display:flex;align-items:center;gap:8px;color:var(--faint);font-weight:500}
.stg i{width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:13px}
.stg.now{color:var(--text)}.stg.now i{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.stg.past{color:var(--mint)}.stg.past i{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.stages .ln{width:40px;height:2px;background:var(--line2)}
.scanviz{position:relative;width:min(460px,90%);background:#0A1016;border-radius:var(--sig-sm);padding:18px;overflow:hidden}
.scanviz .beam{position:absolute;left:0;right:0;height:2px;top:20%;background:var(--yellow);box-shadow:0 0 22px 6px rgba(255,209,0,.45);opacity:0}
.scanviz.running .beam{opacity:1;animation:beam 2.2s var(--ease) infinite alternate}
@keyframes beam{from{top:12%}to{top:86%}}
.elapsed{margin:0;color:var(--muted)}.elapsed b{color:var(--text);font-variant-numeric:tabular-nums}
.cmpl{display:flex;flex-wrap:wrap;gap:var(--sp3);margin:0 0 var(--sp4)}
.cp{display:inline-flex;align-items:center;gap:8px;font-size:var(--f-sm);font-weight:500}
.cp small{color:var(--muted);font-weight:400}
.cp i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.cp.done i{background:var(--mint)}.cp.part i{background:var(--yellow)}.cp.skip i{background:transparent;border:1.5px solid var(--faint)}
.sec3{margin:0 0 var(--sp6)}
.sechd{display:flex;gap:14px;align-items:center;margin:0 0 var(--sp3)}
.sechd>span{width:32px;height:32px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.sechd h3{margin:0;font-size:var(--f-h2);font-weight:700}.sechd small{color:var(--muted);font-size:var(--f-sm)}
.finds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp3);margin-bottom:var(--sp3)}
@media (max-width:760px){.finds{grid-template-columns:1fr}}
.find{border-radius:var(--r);padding:20px;background:var(--s1)}
.find small{display:block;color:var(--muted);font-size:var(--f-meta);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.find b{display:block;font-size:26px;font-weight:700;letter-spacing:-.3px;margin:6px 0 2px}
.find span{font-size:var(--f-sm);color:var(--muted)}
details.tech{display:block}
details.tech summary{cursor:pointer;font-weight:600;color:var(--muted)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line2);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 6%,var(--bg))}
.drop b{font-weight:600}
.drop small{color:var(--muted);font-size:13px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.files{list-style:none;margin:var(--sp2) 0 0;padding:0;display:grid;gap:6px}
.files li{display:flex;gap:10px;align-items:center;border-radius:var(--r-sm);padding:9px 12px;font-size:var(--f-sm);background:var(--s2)}
.files .k{flex:none;font-size:11px;font-weight:700;background:var(--ink);color:var(--yellow);padding:3px 7px;border-radius:6px}
.files .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .s{font-size:12.5px;color:var(--muted);white-space:nowrap}
.files .s.bad{color:var(--coral)}
.files button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.skip{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--f-sm);color:var(--muted);background:none;border:0;padding:0}
.skip .box{width:18px;height:18px}
.view3d{position:relative;background:#0A1016;border-radius:var(--sig);overflow:hidden;height:340px;margin:var(--sp3) 0;touch-action:none}
.view3d canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.view3d .cap{position:absolute;left:16px;bottom:12px;color:#AEB9C4;font-size:12.5px;pointer-events:none}
.view3d .lr{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;color:var(--yellow);font-size:13px;font-weight:600;pointer-events:none}
.meas{width:100%;border-collapse:collapse;font-size:var(--f-sm);margin-top:var(--sp3)}
.meas th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:7px 8px;border-bottom:1px solid var(--line)}
.meas td{padding:8px;border-bottom:1px solid var(--line)}
.meas td:not(:first-child),.meas th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:var(--sp3)}
.thumbs button{border:0;border-radius:var(--r-sm);padding:0;background:#fff;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.thumbs img{display:block;width:100%;height:auto}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--coral);margin-left:10px;animation:blink 1s infinite}
.aud{display:flex;flex-direction:column;gap:4px;margin-top:10px}.aud audio{width:100%}

/* ---------- Finalise: prescription hero ---------- */
.compare{padding:0 0 0 16px;margin:0 0 var(--sp4);border-left:3px solid var(--yellow)}
.compare b{display:block;font-size:19px;font-weight:600;margin-bottom:10px;line-height:1.35}
.cmp{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:4px 11px;font-size:13px;background:var(--s2)}
.cmp.ok{color:var(--mint)}.cmp.new{color:var(--yellow)}.cmp.no{color:var(--faint);text-decoration:line-through}
.cmp .x{border:0;background:transparent;color:var(--muted);font-size:16px;padding:0 0 0 4px;line-height:1}
.rxhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--sp4);align-items:start}
@media (max-width:900px){.rxhero{grid-template-columns:1fr}}
.rxvis{position:sticky;top:130px}
@media (max-width:900px){.rxvis{position:static}}
.rxvis .shoewrap{padding:24px 18px 16px}
.legend{list-style:none;margin:var(--sp3) 0 0;padding:0;display:grid;gap:8px}
.legend li{display:flex;gap:10px;align-items:baseline;font-size:var(--f-sm)}
.legend li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--yellow);transform:translateY(-1px)}
.legend li span{color:var(--muted)}
.rxcard{background:var(--s1);border-radius:var(--sig);padding:var(--sp5)}
.rxcard > small,.aivp > div > small{display:block;color:var(--muted);font-size:var(--f-meta);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:var(--sp4) 0 var(--sp2)}
.rxtop{display:flex;gap:18px;align-items:center;padding-bottom:var(--sp4);border-bottom:1px solid var(--line)}
.rxtop .badge,.seg .badge{width:64px;height:64px;border-radius:20px 6px 6px 6px;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-size:32px;font-weight:700;flex:none}
.rxtop small{color:var(--muted);font-size:var(--f-meta);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.rxtop h3{margin:2px 0;font-size:var(--f-h2)}
.rxtop p{margin:0;color:var(--muted)}
.fixes{list-style:none;margin:0;padding:0}
.fixes li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.fixes li:last-child{border-bottom:0}
.fixes li > span{color:var(--muted);font-size:var(--f-sm)}
.fixes.ed select{padding:5px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--bg)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin:var(--sp2) 0 0}.addrow .inp{margin:0;flex:1;min-width:180px}
.aivp{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp3);margin:0}
@media (max-width:760px){.aivp{grid-template-columns:1fr}}
.aivp>div{background:var(--s2);border-radius:var(--r);padding:14px 16px}
.aivp>div>small{margin-top:0!important}
.aivp .inp{margin:0}
.comps{display:grid;gap:8px}
.comp{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:var(--r-sm);background:var(--s1)}
.comp b{font-weight:600}
.comp span{font-size:13px;color:var(--muted)}
.comp.acc{box-shadow:inset 3px 0 0 var(--mint)}
.comp .linkbtn{font-size:13px;align-self:flex-start}
.confirm{display:flex;gap:14px;align-items:center;padding:18px;border-radius:var(--r);border:1.5px solid var(--line2);background:transparent;width:100%;text-align:left;margin-top:var(--sp4)}
.confirm.on{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 8%,transparent)}
.confirm .box{width:24px;height:24px}

/* ---------- Build / visualiser ---------- */
.meter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 var(--sp4)}
.mt{border:0;border-top:4px solid var(--line2);background:transparent;text-align:left;padding:12px 4px 0;display:flex;flex-direction:column;gap:2px;color:var(--muted);transition:border-color .2s}
.mt.fill{border-top-color:var(--yellow);color:var(--text)}
.mt.on b{color:var(--yellow)}
.mt b{font-size:16px}.mt span{font-size:var(--f-sm)}
.mt em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--mint)}
.mt:disabled{opacity:.4;cursor:not-allowed}
.build{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:var(--sp4);align-items:start}
@media (max-width:900px){.build{grid-template-columns:1fr}}
.stage{position:sticky;top:130px}
@media (max-width:900px){.stage{position:static}}
.shoewrap{background:#0A1016;border-radius:var(--sig);padding:20px 16px 14px;color:#fff}
.shoewrap .cap{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 6px}
.shoewrap .cap b{color:var(--yellow);font-size:20px;font-weight:700}
.shoewrap .cap span{color:#AEB9C4;font-size:13px}
.shoewrap .base{color:#8C99A5;font-size:12.5px;padding:6px 6px 0}
svg.shoe{display:block;width:100%;height:auto}
svg.shoe .lay{fill:#1F2B37;stroke:#5B6874;stroke-width:1.2;transition:fill .35s var(--ease)}
svg.shoe .lay.on{fill:var(--yellow);stroke:var(--yellow)}
svg.shoe .lay.base{fill:color-mix(in srgb,var(--yellow) 30%,#1F2B37);stroke:color-mix(in srgb,var(--yellow) 70%,transparent)}
svg.shoe .line{fill:none;stroke:#8C99A5;stroke-width:2}
svg.shoe .opt{opacity:0;transition:opacity .35s var(--ease)}
svg.shoe .opt.on{opacity:1}
svg.shoe .y{fill:var(--yellow)}
svg.shoe .ys{fill:none;stroke:var(--yellow);stroke-width:3;stroke-linecap:round}
svg.shoe .yd{fill:none;stroke:var(--yellow);stroke-width:2;stroke-dasharray:5 4}
svg.shoe .m{fill:var(--mint)}
svg.shoe .ms{fill:none;stroke:var(--mint);stroke-width:3;stroke-linecap:round}
svg.shoe .absent{fill:none;stroke:#5B6874;stroke-dasharray:4 4}
svg.shoe text{fill:#8C99A5;font-size:10px;font-family:Outfit,Arial,sans-serif}
.basecard{display:flex;gap:12px;align-items:center;margin-top:var(--sp2);border-radius:var(--r);padding:10px;background:var(--s1)}
.basecard .bpic{width:96px;flex:none;border-radius:var(--r-sm);background:#fff;object-fit:contain;aspect-ratio:4/3}
.basecard .bpic.sil{padding:4px 8px;background:var(--s2)}
.basecard small{display:block;color:var(--muted);font-size:12px}
.basecard b{display:block;font-weight:600;font-size:14.5px}
.basecard span{font-size:12.5px;color:var(--muted)}
.receipt{margin-top:var(--sp2);background:var(--s1);border-radius:var(--r);padding:18px}
.receipt .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.receipt .row span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.receipt .row.inc span:last-child{color:var(--muted)}
.receipt .tot{border-top:1px solid var(--line2);margin-top:8px;padding-top:12px;font-size:22px;font-weight:700}
.adds h4{margin:0 0 var(--sp2);font-size:var(--f-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--sp2)}
.add{background:var(--s1);border:1.5px solid transparent;border-radius:var(--r);display:flex;flex-direction:column;transition:border-color .15s}
.add:hover{border-color:var(--line2)}
.add.on{border-color:var(--yellow)}
.add .addb{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px}
.add .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.add .hd b{font-weight:700}
.add p{margin:0;font-size:var(--f-sm)}
.add .sv{font-size:13.5px;color:var(--muted)}
.add .sv strong{color:var(--text);font-weight:600}
.add .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.add .pr{font-size:var(--f-sm);white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.add .why{margin:0 16px 14px;font-size:13px;align-self:flex-start}
.add .extra{display:grid;gap:8px;padding:0 16px 16px}
.add .extra .inp{margin:0}
.add .sw{width:40px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.add .sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.add.on .sw{background:var(--yellow)}
.add.on .sw::after{left:19px}

/* ---------- Modals / drawers ---------- */
.lightbox{position:fixed;inset:0;background:rgba(8,12,16,.82);backdrop-filter:blur(6px);z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));animation:fadein .2s ease}
.lightbox img{max-width:100%;max-height:100%;border-radius:var(--r);background:#fff}
.lightbox > button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:var(--yellow);color:var(--ink);border:0;border-radius:var(--pill);padding:8px 16px;font-weight:700}
.drawer,.fixbox{background:var(--s1);color:var(--text);border-radius:var(--sig);padding:var(--sp4);max-width:540px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--sh)}
.drawer h4{margin:var(--sp3) 0 4px;font-size:15px}
.drawer p{margin:6px 0;font-size:15px}
.fixhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:var(--sp2)}
.fixhd small{display:block;color:var(--muted);font-size:var(--f-meta);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.fixhd b{font-size:20px;font-weight:700}
.exbig{background:#fff;border-radius:var(--r);display:flex;justify-content:center;padding:14px;margin:4px 0 10px}
.exbig .cpic{max-width:440px}
.signs{margin:4px 0;padding-left:18px;font-size:15px}
.disc{font-size:12.5px!important;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:var(--sp3)!important}
.script{margin-top:var(--sp3);padding:12px 14px;border-left:3px solid var(--yellow);background:color-mix(in srgb,var(--yellow) 8%,transparent);font-style:italic;font-size:14.5px}
.script small{display:block;font-style:normal;font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.pdp{background:var(--s1);color:var(--text);border-radius:var(--sig);width:min(1000px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1.25fr 1fr;box-shadow:var(--sh)}
@media (max-width:760px){.pdp{grid-template-columns:1fr}}
.pdpgal{position:relative;background:#fff;border-radius:32px 0 0 0;overflow:hidden}
@media (max-width:760px){.pdpgal{border-radius:32px 6px 0 0}}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.slides::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;margin:0;position:relative;display:flex;align-items:center;justify-content:center;min-height:380px}
.sl img{width:100%;height:100%;max-height:580px;object-fit:contain}
.sl figcaption{position:absolute;left:14px;bottom:12px;background:rgba(16,24,32,.85);color:#fff;font-size:12.5px;padding:4px 10px;border-radius:var(--pill)}
.pdpgal .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(16,24,32,.78);color:#fff;font-size:24px;line-height:1}
.pdpgal .prev{left:12px}.pdpgal .next{right:12px}
.pdpinfo{padding:var(--sp4)}
.pdpinfo .pp{font-size:28px;font-weight:700;margin:4px 0 8px}
.pdpinfo p{margin:6px 0;font-size:15px}
.pdpinfo .because{color:var(--yellow);font-weight:500}
.pdpinfo .lbl{display:block;color:var(--muted);margin:var(--sp3) 0 8px}
.swatches.big .sw2{width:34px;height:34px}

/* ---------- Report ---------- */
.paper{background:#fff;color:#101820;border-radius:var(--sig);overflow:hidden;max-width:880px;box-shadow:var(--sh)}
.seg{display:flex;gap:18px;align-items:center;margin-bottom:var(--sp4);flex-wrap:wrap}
.seg h2{margin:0;font-size:var(--f-h2)}.seg p{margin:2px 0 0;color:var(--muted)}

/* ---------- Bottom action bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .price{flex:1;font-size:var(--f-meta);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.bar .price b{display:block;color:var(--text);font-size:24px;font-weight:700;letter-spacing:0;text-transform:none;line-height:1.15}
.bar .btn.pri{padding:14px 26px;font-size:16px;box-shadow:0 8px 24px -10px rgba(255,209,0,.6)}

/* ---------- Admin: log, prices, assets ---------- */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:var(--f-sm)}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--s2)}
.tbl select{padding:6px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--bg)}
.aslot{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.aslot:last-child{border-bottom:0}
.apv{width:92px;height:52px;flex:none;border-radius:var(--r-sm);background:var(--s2);display:grid;place-items:center;overflow:hidden}
.apv img{width:100%;height:100%;object-fit:cover}
.ainfo{flex:1;min-width:0;position:relative}
.ainfo b{display:block;font-weight:600;font-size:14.5px}
.ainfo small{color:var(--muted);font-size:12.5px}

/* ---------- Motion ---------- */
.slide.fw{animation:slfw .4s var(--ease) both}
.slide.bk{animation:slbk .4s var(--ease) both}
@keyframes slfw{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slbk{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s var(--ease);max-width:min(520px,90vw);z-index:60;border-left:3px solid var(--yellow);box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.making{position:fixed;inset:0;z-index:50;background:radial-gradient(800px 500px at 50% 40%,rgba(255,209,0,.16),transparent 70%),#0D141B;display:grid;place-items:center;color:#fff;animation:fadein .3s ease;transition:opacity .4s}
.making.out{opacity:0}
.mk{text-align:center;width:min(460px,86vw)}
.mkshoe{position:relative;background:#0A1016;border-radius:var(--sig);padding:16px;margin-bottom:var(--sp4)}
.mkshoe i{position:absolute;left:12%;right:12%;height:4px;border-radius:2px;background:var(--yellow);opacity:0;animation:lay .5s var(--ease) forwards}
.mkshoe .l1{bottom:24%;animation-delay:.4s}.mkshoe .l2{bottom:31%;animation-delay:1.1s}.mkshoe .l3{bottom:38%;animation-delay:1.8s}
@keyframes lay{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.mk p{margin:0;color:#AEB9C4;font-size:18px}
.mk h2{margin:4px 0 var(--sp4);font-size:34px;font-weight:700;color:var(--yellow)}
.mkbar{height:3px;background:#2B3946;border-radius:2px;overflow:hidden}.mkbar i{display:block;height:100%;background:var(--yellow);animation:mkbar 3s linear forwards}
@keyframes mkbar{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- Customer mode: calmer, larger ---------- */
body.m-cust .lead{font-size:clamp(34px,4.2vw,48px)}
body.m-cust .sub{font-size:18px}
body.m-cust .cond .fixline{display:none}


/* ---------- Multiple pairs ---------- */
.pairtray{background:var(--s1);border-radius:var(--r);padding:14px 16px;margin:0 0 var(--sp3)}
.pthd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}.pthd small{color:var(--muted)}
.ptlist{display:flex;gap:10px;flex-wrap:wrap}
.pairc{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:var(--r-sm);padding:8px 10px;min-width:220px}
.pairc .pimg{width:64px;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.pairc .pimg.sil{background:var(--s3)}
.pairc small{display:block;color:var(--yellow);font-size:11.5px;font-weight:700;letter-spacing:.04em}
.pairc b{display:block;font-size:14px}.pairc span{font-size:12.5px;color:var(--muted)}
.pairc .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px}
.pairbadge{position:absolute;top:12px;right:12px;z-index:1;background:var(--yellow);color:var(--ink);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:var(--pill)}
.sw2.picked{outline:2px solid var(--mint);outline-offset:2px}
.receipt .row.inc2 span:first-child{color:var(--muted);padding-left:12px}
.receipt .sep{height:1px;background:var(--line);margin:6px 0}
.pairtabs{margin-top:0}

/* ---------- Print ---------- */
@media print{
  .top,.bar,.actions,.toast,.noprint,.foot{display:none!important}
  main{padding:0}.paper{box-shadow:none;max-width:none}body{background:#fff}
}

</style>

const COND_EDU = {
  pf:{plain:'Heel pain, worst with the first steps of the day', means:'The thick band under the foot, the plantar fascia, gets irritated where it joins the heel bone.', signs:['Sharp heel pain with the first steps in the morning','Pain after standing or walking for long','Tenderness under the heel']},
  pronation:{plain:'The foot rolls inward as it lands', means:'The ankle tips inward on each step, so the arch drops and the leg twists slightly with it.', signs:['Shoes wear out on the inner edge first','Arch, shin or knee ache after walking','Ankles lean inward when standing']},
  flat:{plain:'The arch sits low or touches the floor', means:'The inner arch is low or flattens when standing, so the whole sole takes the load.', signs:['Most of the sole touches the floor','Tired, aching feet by evening','Ankles roll in when standing']},
  corn:{plain:'Hard or thick skin where shoes press', means:'Skin thickens to protect itself where the foot is pressed or rubbed again and again.', signs:['Hard, yellowish patches of skin','A small hard core that hurts when pressed','Usually on toe tops or under the ball of the foot']},

function parseCSV(text){

    else if (ch === '"') q = true;

    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }

function unb64(str){ const s = atob(str.trim()); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b.buffer; }
const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

async function addFiles(slot, list){
  for (const f of list){
    const kind = fileKind(f.name);
    if (!kind || (SLOT_KINDS[slot] && !SLOT_KINDS[slot].includes(kind))){ toast(slot === '3d' ? `${f.name}: only STL and CSV files go here.` : slot === '2d' ? `${f.name}: only the PDF report goes here.` : `${f.name}: use a PDF or photo.`); continue; }
    if (f.size > 20 * 1024 * 1024){ toast(`${f.name} is over 20 MB.`); continue; }
    const e = {uid:uid(), slot, name:f.name, kind, id:null, side: kind === 'stl' ? sideOf(f.name) : '', status:'reading'};
    S.files.push(e); S.skip[slot] = false; render();
    try {
      const buf = await f.arrayBuffer();
      if (kind === 'csv'){
        const parsed = parseVolumental(new TextDecoder().decode(buf));
        if (parsed){ S.scan3d = parsed; e.parsed = true; }
        else toast(`${f.name} doesn’t look like a Volumental export. Kept as a file only.`);
      }
      if (kind === 'stl'){
        if (!e.side){ const others = S.files.filter(x => x.kind === 'stl' && x !== e).map(x => x.side); e.side = others.includes('L') ? 'R' : 'L'; }
        MEDIA.stl[e.uid] = buf;
      }
      if (kind === 'pdf'){ MEDIA.pdf[e.uid] = buf; pdfThumbs(e.uid); }
      if (kind === 'image') MEDIA.img[e.uid] = await readDataURL(f);
      e.status = 'uploading'; render();
      if (assets){
        let blob = f, type = f.type;
        if (kind === 'stl'){ blob = new Blob([b64(buf)], {type:'text/plain'}); type = 'text/plain'; }
        else if (kind === 'csv'){ blob = new Blob([buf]); type = 'text/csv'; }
        else if (kind === 'pdf') type = 'application/pdf';
        else if (!/^image\//.test(type)) type = 'image/' + ({jpg:'jpeg'}[f.name.split('.').pop().toLowerCase()] || f.name.split('.').pop().toLowerCase());
        const r = await assets.upload(blob, {type});
        e.id = r.id; e.status = 'saved';
      } else e.status = 'local';
    } catch (err){
      e.status = 'failed';
      toast(err && err.code === 'too_large' ? `${f.name} is too large to store.` : err && err.code === 'quota_or_state' ? 'Report storage is full. Remove old files first.' : `${f.name} couldn’t be stored. It’s still on this screen.`);
    }
    render();
  }
}
async function removeFile(id){
  const e = S.files.find(x => x.uid === id); if (!e) return;
  S.files = S.files.filter(x => x !== e);
  ['stl','pdf','thumbs','img'].forEach(k => delete MEDIA[k][id]);
  if (e.kind === 'csv' && !S.files.some(x => x.kind === 'csv' && x.parsed)) S.scan3d = null;
  if (e.id && assets && !S.id){ try { await assets.delete(e.id); } catch(_){} }
  render();

async function pdfThumbs(id){
  try {
    await loadScript(PDFJS_URL);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFW_URL;
    const doc = await window.pdfjsLib.getDocument({data:new Uint8Array(MEDIA.pdf[id].slice(0))}).promise;
    const out = [];
    for (let p = 1; p <= Math.min(doc.numPages, 8); p++){
      const page = await doc.getPage(p);
      const vp = page.getViewport({scale: 900 / page.getViewport({scale:1}).width});
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
      out.push(cv.toDataURL('image/jpeg', .82));
    }
    MEDIA.thumbs[id] = out;
  } catch (_) { MEDIA.thumbs[id] = []; }
  if (view === 'flow' && (step === 2 || step === 6)) render();
}
async function rehydrate(){
  for (const e of S.files){
    if (!e.id) continue;
    try {
      if (e.kind === 'stl' && !MEDIA.stl[e.uid]) MEDIA.stl[e.uid] = unb64(await (await fetch('/_blob/' + e.id)).text());
      if (e.kind === 'pdf' && !MEDIA.pdf[e.uid]){ MEDIA.pdf[e.uid] = await (await fetch('/_blob/' + e.id)).arrayBuffer(); pdfThumbs(e.uid); }
      if (e.kind === 'image' && !MEDIA.img[e.uid]) MEDIA.img[e.uid] = '/_blob/' + e.id;

let V = null;
function parseSTL(buf){
  const dv = new DataView(buf);
  const n = buf.byteLength >= 84 ? dv.getUint32(80, true) : 0;
  if (84 + 50 * n === buf.byteLength){
    const pos = new Float32Array(n * 9);
    for (let i = 0; i < n; i++){ const o = 84 + 50 * i + 12; for (let k = 0; k < 9; k++) pos[i*9+k] = dv.getFloat32(o + k*4, true); }
    return pos;
  }
  const t = new TextDecoder().decode(buf), v = [];
  t.replace(/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g, (_, x, y, z) => { v.push(+x, +y, +z); return ''; });
  return new Float32Array(v);
}
async function mount3D(){
  const box = document.getElementById('foot3d'); if (!box) return;
  const stls = S.files.filter(f => f.kind === 'stl' && MEDIA.stl[f.uid]);
  if (!stls.length) return;
  try { await loadScript(THREE_URL); } catch (_) { box.querySelector('.cap').textContent = '3D preview couldn’t load on this connection.'; return; }
  const T = window.THREE;
  if (!V){
    const renderer = new T.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(32, 1, 1, 5000);
    scene.add(new T.HemisphereLight(0xffffff, 0x3a4753, .95));
    const dl = new T.DirectionalLight(0xffffff, .75); dl.position.set(250, 500, 350); scene.add(dl);
    const ground = new T.Mesh(new T.CircleGeometry(250, 72), new T.MeshBasicMaterial({color:0x1B2733}));
    ground.rotation.x = -Math.PI/2; scene.add(ground);
    const ring = new T.Mesh(new T.RingGeometry(232, 248, 96), new T.MeshBasicMaterial({color:0xFFD100}));
    ring.rotation.x = -Math.PI/2; ring.position.y = .5; scene.add(ring);
    const group = new T.Group(); scene.add(group);
    V = {renderer, scene, camera, group, key:'', theta:.55, phi:.42, dist:720};
    const el = renderer.domElement; let drag = null;
    el.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', e => { if (!drag) return; V.theta += (e.clientX - drag.x) * .01; V.phi = Math.max(.08, Math.min(1.35, V.phi + (e.clientY - drag.y) * .006)); drag = {x:e.clientX, y:e.clientY}; draw3D(); });
    el.addEventListener('pointerup', () => { drag = null; el.style.cursor = 'grab'; });
    el.addEventListener('wheel', e => { e.preventDefault(); V.dist = Math.max(360, Math.min(1300, V.dist + e.deltaY * .6)); draw3D(); }, {passive:false});
  }
  const key = stls.map(f => f.uid + f.side).join('|');
  if (V.key !== key){
    while (V.group.children.length) V.group.remove(V.group.children[0]);
    stls.slice(0, 2).forEach((f, i) => {
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.BufferAttribute(parseSTL(MEDIA.stl[f.uid]), 3));
      geo.computeBoundingBox(); const bb = geo.boundingBox;
      geo.translate(-(bb.min.x + bb.max.x)/2, -(bb.min.y + bb.max.y)/2, -bb.min.z);
      geo.computeVertexNormals();
      const mesh = new T.Mesh(geo, new T.MeshStandardMaterial({color:0xE9EEF3, roughness:.72, metalness:0}));
      mesh.rotation.x = -Math.PI/2;
      const side = f.side || (i ? 'R' : 'L');
      mesh.position.x = stls.length > 1 ? (side === 'L' ? -78 : 78) : 0;
      V.group.add(mesh);
    });
    V.key = key;
  }
  box.prepend(V.renderer.domElement);
  const w = box.clientWidth, h = box.clientHeight;
  V.renderer.setSize(w, h, false); V.camera.aspect = w / h; V.camera.updateProjectionMatrix();
  draw3D();
}
function draw3D(){
  if (!V) return;
  V.camera.position.set(V.dist * Math.sin(V.theta) * Math.cos(V.phi), V.dist * Math.sin(V.phi) + 40, V.dist * Math.cos(V.theta) * Math.cos(V.phi));
  V.camera.lookAt(0, 45, 0);
  V.renderer.render(V.scene, V.camera);
}
function snap3D(){ if (!V || !V.group.children.length) return null; draw3D(); try { return V.renderer.domElement.toDataURL('image/png'); } catch(_) { return null; } }

function subProblems(i, sb){
  if (i === 0 && sb === 1){
    if (!S.name.trim()) return 'Add the customer’s name.';
    if (!/^\d{10}$/.test(S.mobile)) return 'Mobile number needs 10 digits.';
    if (S.email && !/^\S+@\S+\.\S+$/.test(S.email)) return 'That email doesn’t look complete.';
    const a = +S.age; if (!S.age || !(a > 0 && a < 111)) return 'Add the customer’s age.';
    if (!S.gender) return 'Pick a gender.';
    if (!S.category) return 'Pick the shoe category.';
    if (!S.pod.trim()) return 'Add the podiatrist’s name (Staff view).';
  }
  if (i === 0 && sb === 2 && !S.healthy && !S.unknown && !Object.keys(S.perceived).length) return 'Pick what they’re experiencing, “I don’t know”, or “None of these”.';
  if (i === 1){ if (S.design !== 'closed') return 'Pick a design.'; if (!S.base) return 'Pick the base Frido shoe.'; if (!(S.unknown && !condList().length)){ const bad = pairs().find(pr => !productFit(PR[pr.base]).ok); if (bad) return `${pairLabel(bad)} isn’t advised for these conditions. Remove it or pick another.`; } }
  if (i === 2 && sb === 0 && S.scan.state !== 'done') return S.scan.state === 'running' ? 'Tap “Scan completed” when the scan is finished.' : 'Start the scan first, or mark it as not done.';
  if (i === 2 && sb === 1){
    if (S.files.some(f => f.status === 'reading' || f.status === 'uploading')) return 'Wait for the files to finish uploading.';
    if (!S.skip['3d'] && !S.files.some(f => f.slot === '3d')) return 'Upload the 3D scan STL and CSV, or tick that it wasn’t done.';
    if (!S.skip['2d'] && !S.files.some(f => f.slot === '2d')) return 'Upload the gait analysis PDF, or tick that it wasn’t done.';
  }
  { const bad = i === 3 && sb === 0 ? pairs().find(pr => !productFit(PR[pr.base]).ok) : null; if (bad) return `Sorry, we won’t recommend the ${PR[bad.base].name.replace('Frido ','')} for these feet. Change that pair first.`; }
  if (i === 3 && sb === 0 && !S.confirm) return 'The podiatrist needs to confirm the prescription.';
  if (i === 4 && S.up.engrave && !S.up.text.trim()) return 'Add the engraving text, or switch engraving off.';
  return '';
}

async function importSheet(n, file){
  if (!assets || !db){ toast('Importing needs edit access to the portal.'); return; }
  try {
    const bmp = await createImageBitmap(file);
    const cw = bmp.width / 4, ch = bmp.height / 5, ids = SHEETS[n], got = {};
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', {willReadFrequently:true});
    const outW = Math.min(640, Math.round(cw)), outH = Math.round(outW * ch / cw);
    cv.width = outW; cv.height = outH;
    for (let i = 0; i < ids.length; i++){
      toast(`Importing ${i + 1} of ${ids.length}…`);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, outW, outH);
      ctx.drawImage(bmp, (i % 4) * cw + 2, Math.floor(i / 4) * ch + 2, cw - 4, ch - 4, 0, 0, outW, outH);
      const px = ctx.getImageData(0, 0, outW, outH).data; let ink = 0;
      for (let k = 0; k < px.length; k += 64) if (px[k] < 235 || px[k+1] < 235 || px[k+2] < 235) ink++;
      if (ink < 20) continue;
      const blobOut = await new Promise(r => cv.toBlob(r, 'image/webp', .86));
      const r = await assets.upload(blobOut, {type:'image/webp'});
      got[ids[i]] = r.id;
    }
    const next = JSON.parse(JSON.stringify(BA)); Object.assign(next.products, got);
    await db.doc('settings/assets').set(next);
    toast(`Imported ${Object.keys(got).length} product photos.`);
  } catch (err){ toast('That sheet couldn’t be imported. Try again.'); }
}

function go(n, toSub = 0){

    case 'cond': if (has(v)){ delete S.conds[v]; delete S.perceived[v]; } else { S.conds[v] = 'mild'; S.perceived[v] = 'mild'; S.healthy = false; S.unknown = false; } if (v === 'diabetes' && !has(v)) S.flags = []; S.confirm = false; break;
    case 'addcond': S.conds[v] = 'mild'; S.healthy = false; S.confirm = false; toast(`${C[v].name} added to the findings.`); S.unknown = false; break;
    case 'sev': { const [id, lv] = v.split('|'); S.conds[id] = lv; S.confirm = false; break; }
    case 'flag': toggle(S.flags, v); break;
    case 'design': S.design = v; break;

    case 'pdpcross': toggle(S.cross, pdp.id); $('#lb').innerHTML = ''; break;
    case 'uni': S.uni = !S.uni; break;
    case 'style': S.style = v; break;
    case 'color': { const [pid, c] = v.split('|'); cardCol[pid] = c; break; }
    case 'scanstart': S.scan = {state:'running', t0:Date.now()}; break;
    case 'scandone': S.scan = {state:'done', done:new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}; sub = 1; dir = 1; break;
    case 'scanskip': S.scan = {state:'done', done:''}; S.skip = {'3d':true,'2d':true}; sub = 1; dir = 1; break;
    case 'rec': toggleRec(); return;
    case 'fdel': delete S.conds[v]; S.confirm = false; break;
    case 'xadd': { const el = document.getElementById('xfind'); const t = (el.value || '').trim(); if (!t) { toast('Type the finding first.'); return; } S.xfind.push(t); S.confirm = false; break; }
    case 'xdel': S.xfind.splice(+v, 1); break;
    case 'cdel': if (locked().includes(v)){ toast(`${A[v].name} is required for diabetic feet.`); return; } S.addons = S.addons.filter(x => x !== v); if (recs()[v] && !S.dropped.includes(v)) S.dropped.push(v); break;
    case 'pdfwa': sharePDF(); return;
    case 'pdfdl': downloadPDF(); return;
    case 'mode': mode = v; break;
    case 'admin': adminOpen = !adminOpen; renderNav(); return;
    case 'showall': showAll = !showAll; break;
    case 'iso': iso = v; break;
    case 'why': { const [k, id] = v.split('|'); showWhy(k, k === 'level' ? +id : id); return; }
    case 'example': showExample(v); return;
    case 'base': { const [pid, c] = v.split('|'); const col = c || cardCol[pid] || (colorsOf(pid)[0] || {}).n || ''; if (step === 3) { S.base = pid; S.color = col; break; } if (!addPair(pid, col)) return; break; }
    case 'pairdel': removePair(+v); break;
    case 'pairtab': buildTarget = +v; break;
    case 'paircust': { const pr = S.extra[+v]; pr.custom = !pr.custom; if (pr.custom){ pr.tier = S.tier; pr.addons = [...S.addons]; pr.dropped = []; } break; }
    case 'showfix': showFix(v); return;
    case 'rmasset': removeAsset(v); return;
    case 'skip': S.skip[v] = !S.skip[v]; break;
    case 'rmfile': removeFile(v); return;
    case 'zoom': { const [k, id, i] = v.split('|'); showLB(k === 'pdf' ? MEDIA.thumbs[id][+i] : MEDIA.img[id]); return; }
    case 'closelb': if (el.classList.contains('lightbox') && e.target !== el) return; $('#lb').innerHTML = ''; return;
    case 'confirm': S.confirm = !S.confirm; break;
    case 'tier': withTarget(() => setTier(+v)); break;
    case 'addon': withTarget(() => toggleAddon(v)); break;
    case 'engrave': S.up.engrave = !S.up.engrave; break;
    case 'place': S.up.place = v; break;
    case 'footbed': S.up.footbed = S.up.footbed === v ? '' : v; break;
    case 'cross': toggle(S.cross, v); break;
    case 'save': save(); return;
    case 'download': download(); return;
    case 'print': try { window.print(); } catch(_) { toast('Printing isn’t available here. Use Download report instead.'); } return;
    case 'open': openRecord(v); return;
    case 'saveprices': savePrices(); return;
    case 'resetprices': P = JSON.parse(JSON.stringify(DEFAULT_PRICES)); render(); toast('Prices reset. Save to apply them for everyone.'); return;
    default: return;
  }
  const y = window.scrollY; render(); window.scrollTo({top:y});
});

function setTier(n){
  if (n < minTier()){ toast('Diabetic feet need at least Fit+.'); return; }
  const removed = S.addons.filter(id => A[id].min > n);
  S.tier = n;
  if (removed.length){
    S.addons = S.addons.filter(id => !removed.includes(id));
    removed.forEach(id => { if (recs()[id] && !S.dropped.includes(id)) S.dropped.push(id); });
    toast(`Removed ${removed.map(id=>A[id].name).join(', ')}: needs a higher build.`);
  }
}
function toggleAddon(id){
  const a = A[id];
  if (S.addons.includes(id)){
    if (locked().includes(id)){ toast(`${a.name} is required for diabetic feet.`); return; }
    S.addons = S.addons.filter(x => x !== id);
    if (recs()[id] && !S.dropped.includes(id)) S.dropped.push(id);
  } else {
    if (a.min > S.tier){ S.tier = a.min; toast(`Moved to ${TIERS[a.min].name}: ${a.name} needs it.`); }
    S.addons.push(id); S.dropped = S.dropped.filter(x => x !== id);
  }
}

  </div></div>`;
}
async function uploadAsset(key, f){
  if (!assets){ toast('Uploads need edit access to the portal.'); return; }
  if (!db){ toast('Assets can only be saved when the portal is opened from its claude.ai link.'); return; }
  try {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    let type = f.type;
    if (/^font/.test(key)) type = ({woff2:'font/woff2', woff:'font/woff', ttf:'font/ttf', otf:'font/otf'})[ext] || type;
    else if (!/^image\//.test(type)) type = ext === 'svg' ? 'image/svg+xml' : 'image/' + ({jpg:'jpeg'}[ext] || ext);
    const r = await assets.upload(f, {type});
    const next = JSON.parse(JSON.stringify(BA));
    if (key.startsWith('products.')) next.products[key.slice(9)] = r.id;
    else if (key.startsWith('conds.')) next.conds[key.slice(6)] = r.id;
    else next[key] = r.id;
    await db.doc('settings/assets').set(next);
    toast('Uploaded. It now shows everywhere this item appears.');
  } catch (err){
    toast(err && err.code === 'unsupported_type' ? 'That file type isn’t supported here.' : err && err.code === 'too_large' ? 'That file is too large.' : err && err.code === 'invalid_argument' ? 'Only editors can change brand assets.' : 'Couldn’t upload that file. Try again.');
  }
}
async function removeAsset(key){
  if (!db) return;
  const next = JSON.parse(JSON.stringify(BA));
  let id;
  if (key.startsWith('products.')){ id = next.products[key.slice(9)]; delete next.products[key.slice(9)]; }
  else if (key.startsWith('conds.')){ id = next.conds[key.slice(6)]; delete next.conds[key.slice(6)]; }
  else { id = next[key]; next[key] = null; }
  try { await db.doc('settings/assets').set(next); if (id && assets) await assets.delete(id); toast('Removed.'); }
  catch (_) { toast('Couldn’t remove that asset.'); }
}
function applyBrand(){
  const wm = $('#wm');
  if (BA.logo) wm.innerHTML = `<img src="${blob(BA.logo)}" alt="Frido" style="height:36px;display:block">`; else wm.textContent = 'frido';

async function logoDataURL(){

  try { const b = await (await fetch(blob(BA.logo))).blob(); return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); } catch (_) { return ''; }
}

let rec = null, recChunks = [];
async function toggleRec(){
  if (rec){ rec.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    rec = new MediaRecorder(st); recChunks = [];
    rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    rec.onstop = async () => {
      st.getTracks().forEach(t => t.stop());
      const b = new Blob(recChunks, {type:(rec.mimeType || 'audio/webm').split(';')[0]}); rec = null;
      const e = {uid:uid(), slot:'audio', kind:'audio', name:'Voice note ' + new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}), id:null, status:'uploading'};
      S.files.push(e); MEDIA.audio[e.uid] = await readDataURL(b); render();
      if (assets){ try { const r = await assets.upload(b, {type:'video/webm'}); e.id = r.id; e.status = 'saved'; } catch(_){ e.status = 'local'; } } else e.status = 'local';
      render();
    };
    rec.start(); render();
  } catch (_) { rec = null; toast('The microphone isn’t available here. Record on your phone and attach it later.'); }
}
async function makePDF(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const el = document.querySelector('.paper'); if (!el) throw new Error('no report');
  const cv = await window.html2canvas(el, {scale:1.6, backgroundColor:'#ffffff', useCORS:true});
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:'pt', format:'a4'});
  const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
  const pxPerPage = Math.floor(cv.width * ph / pw);
  for (let y = 0, pg = 0; y < cv.height; y += pxPerPage, pg++){
    const h = Math.min(pxPerPage, cv.height - y), c = document.createElement('canvas'); c.width = cv.width; c.height = h;
    c.getContext('2d').drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
    if (pg) pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, pw, h * pw / cv.width);
  }
  return new File([pdf.output('blob')], `Frido-Foot-Profile-${S.name.trim().replace(/[^\w]+/g,'-') || 'customer'}.pdf`, {type:'application/pdf'});
}
async function sharePDF(){
  toast('Preparing the PDF…');

  try { if (navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], text:waText()}); return; } } catch (err){ if (err && err.name === 'AbortError') return; }
  await savePDF(f);
  window.open(`https://wa.me/91${S.mobile}?text=${encodeURIComponent(waText() + '\n\nYour Frido Foot Profile PDF is attached.')}`, '_blank', 'noopener');
  toast('PDF downloaded. Attach it in the WhatsApp chat that just opened.');
}
async function downloadPDF(){ toast('Preparing the PDF…'); try { await savePDF(await makePDF()); } catch (_) { toast('Couldn’t create the PDF. Try Print instead.'); } }
async function savePDF(f){
  try { const dl = window.claude ? await window.claude.use('downloads') : null;
    if (dl){ const r = await dl.save({filename:f.name, data:f}); if (r && r.status === 'saved') toast('PDF downloaded.'); return; } } catch (err){ if (err && (err.code === 'cancelled' || err.code === 'declined')) return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Storage ---------- */
function record(){
  return {
    createdAt: S.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(),
    store:S.store, pod:S.pod, name:S.name.trim(), mobile:S.mobile, email:S.email, age:S.age, gender:S.gender, category:S.category,
    conds:S.conds, extra:S.extra, unknown:S.unknown, perceived:S.perceived, xfind:S.xfind, color:S.color, style:S.style, uni:S.uni, scan:S.scan, nextVisit:S.nextVisit, healthy:S.healthy, flags:S.flags, design:S.design,
    files:S.files.filter(f => f.id).map(f => ({uid:f.uid, slot:f.slot, name:f.name, kind:f.kind, id:f.id, side:f.side||'', status:'saved', parsed:!!f.parsed})),
    skip:S.skip, scan3d:S.scan3d, notes:S.notes,
    segment:segment(), tier:S.tier, addons:S.addons, dropped:S.dropped, up:S.up, cross:S.cross, total:grand(),
    status: redFlag() ? 'On hold' : (S.status || 'Quoted')
  };
}
async function save(){
  if (!db){ toast('Saving isn’t available in this view. Download the report instead.'); return; }
  saving = true; render();
  try {
    const rec = record();
    if (S.id) await db.doc('assessments/' + S.id).set(rec);
    else { const ref = db.collection('assessments').doc(); await ref.set(rec); S.id = ref.id; }
    S.createdAt = rec.createdAt; S.status = rec.status;
    const unsaved = S.files.filter(f => !f.id).length;
    toast(`Saved ${S.name.trim()} to the log.${unsaved ? ` ${unsaved} file${unsaved>1?'s':''} weren’t stored.` : ''}`);
  } catch (err){
    toast(err.code === 'invalid_argument' ? 'You don’t have permission to save here. Ask the owner for Contributor access.'
        : err.code === 'quota_exceeded' ? 'The log is full. Remove old records before saving new ones.'
        : 'Couldn’t save. Check the connection and try again.');
  }
  saving = false; render();
}
function openRecord(id){
  const r = logs.find(x => x._id === id); if (!r) return;
  S = Object.assign(blank(), JSON.parse(JSON.stringify(r)));
  S.up = Object.assign(blank().up, S.up || {}); S.skip = Object.assign(blank().skip, S.skip || {});
  S.id = id; S.confirm = true; delete S._id;
  S.sig = JSON.stringify([S.conds, S.healthy]);
  Object.keys(MEDIA).forEach(k => MEDIA[k] = k === 'snap' ? null : {}); sub = 0;
  view = 'flow'; step = 6; maxStep = 6; render(); window.scrollTo({top:0});
  rehydrate();
}
function startLog(){
  if (!db || logUnsub) return;
  logUnsub = db.collection('assessments').orderBy('createdAt','desc').limit(500).onSnapshot(snap => {
    logs = snap.docs.map(d => Object.assign({_id: d.id}, d.data()));

  }, () => { logUnsub = null; toast('The log stopped updating. Reopen it to refresh.'); });
}
async function savePrices(){

  catch (err){ toast(err.code === 'invalid_argument' ? 'Only editors can change prices.' : 'Couldn’t save prices. Try again.'); }
}
async function download(){
  MEDIA.logoData = await logoDataURL();
  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Frido foot assessment — ${esc(S.name)}</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#F3F6F9}.wrap{max-width:880px;margin:24px auto;border-radius:28px 6px 6px 6px;overflow:hidden;box-shadow:0 0 0 1px #DDE5ED}${REPORT_CSS}@media print{body{background:#fff}.wrap{margin:0;box-shadow:none}}</style></head><body><div class="wrap">${reportHTML()}</div></body></html>`;
  MEDIA.logoData = '';

function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }

/* Paste import: a JSON payload {myos:1, products:{id:dataURL}, conds:{id:dataURL}} */
function dataURLBlob(u){ const [h, b] = u.split(','); const type = h.slice(5).split(';')[0]; const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type}); }
async function importPayload(pl){
  if (!assets || !db){ toast('Importing needs edit access to the portal.'); return; }
  const next = JSON.parse(JSON.stringify(BA)); let n = 0, tot = Object.keys(pl.products||{}).length + Object.keys(pl.conds||{}).length;
  for (const grp of ['products','conds']) for (const [id, u] of Object.entries(pl[grp] || {})){
    try { const b = dataURLBlob(u); const r = await assets.upload(b, {type:b.type}); next[grp][id] = r.id; n++; toast(`Importing ${n} of ${tot}…`); } catch(_){}
  }
  if (pl.credits) next.credits = Object.assign({}, next.credits || {}, pl.credits);
  try { await db.doc('settings/assets').set(next); toast(`Imported ${n} images.`); } catch(_){ toast('Images uploaded but couldn’t be saved. Try again.'); }
}
document.addEventListener('paste', e => {
  const t = e.clipboardData && e.clipboardData.getData('text/plain');
  if (t && t.startsWith('{"myos":')){ e.preventDefault(); try { importPayload(JSON.parse(t)); } catch(_){ toast('That paste couldn’t be read.'); } }
});

/* ---------- Boot ---------- */
render();
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    [db, user, assets] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('assets')]);
    if (user && typeof user.can === 'function'){ const c = user.can('data.write'); canWrite = c !== false; }
    if (db){
      db.doc('settings/prices').onSnapshot(snap => {
        if (!snap.exists) return;
        const d = snap.data();
        if (Array.isArray(d.tiers) && d.tiers.length === 5) P = {tiers:[...d.tiers], extras:Object.assign({}, DEFAULT_PRICES.extras, d.extras||{}), up:Object.assign({}, DEFAULT_PRICES.up, d.up||{}), colors:Object.assign({}, DEFAULT_PRICES.colors, d.colors||{}), products:Object.assign({}, DEFAULT_PRICES.products, d.products||{})};
        if (document.activeElement?.dataset?.price === undefined && !(view === 'flow' && step === 2)) render();
      }, () => {});
      db.doc('settings/assets').onSnapshot(snap => {
        if (snap.exists){ const d = snap.data(); BA = {logo:d.logo||null, fontR:d.fontR||null, fontB:d.fontB||null, products:d.products||{}, conds:d.conds||{}, credits:d.credits||{}}; }
        applyBrand();
        if (!(view === 'flow' && step === 2)) render();
      }, () => {});
    }
    render();
  } catch (_) {}
})();
